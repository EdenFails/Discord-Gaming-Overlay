<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Discord Gaming Overlay</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent !important;
            overflow: hidden;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gaming-overlay-container {
            position: relative;
            padding: 10px;
            height: fit-content;
            max-height: 100vh;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            transition: opacity 0.5s ease-in-out;
            color: white;
            font-family: 'Inter', 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            border-radius: 8px;
            overflow: hidden;
        }

        .gaming-overlay-container.typing-active {
            opacity: 1;
        }

        .gaming-overlay-messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 90px); /* Leave room for input */
            pointer-events: none;
            scrollbar-width: none; /* Firefox */
        }
        .gaming-overlay-messages::-webkit-scrollbar {
            display: none;
        }

        .gaming-overlay-message {
            background-color: rgba(0, 0, 0, 0.5);
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
            backdrop-filter: blur(2px);
            word-wrap: break-word;
            pointer-events: auto;
        }

        .gaming-overlay-message.highlighted-message {
            background-color: rgba(88, 101, 242, 0.35) !important;
            border-left: 4px solid #5865F2 !important;
            box-shadow: 0 0 12px rgba(88, 101, 242, 0.5), inset 0 0 10px rgba(88, 101, 242, 0.2);
            animation: highlightPulse 2s infinite alternate;
        }

        @keyframes highlightPulse {
            0% { border-left-color: #5865F2; box-shadow: 0 0 10px rgba(88, 101, 242, 0.4); }
            100% { border-left-color: #00d2ff; box-shadow: 0 0 16px rgba(0, 210, 255, 0.6); }
        }

        .gaming-overlay-author {
            font-weight: bold;
            margin-right: 6px;
        }

        .gaming-overlay-input-container {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.7);
            border-top: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
        }

        .gaming-overlay-input {
            width: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .gaming-overlay-input:focus {
            border-color: rgba(255,255,255,0.5);
        }
        
        /* Custom Emoji support */
        .emoji {
            height: 22px;
            vertical-align: bottom;
            display: inline-block;
        }

        .gaming-overlay-attachment {
            max-width: 120px;
            max-height: 100px;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .gaming-overlay-file {
            background-color: #2b2d31;
            padding: 8px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 12px;
            color: #dbdee1;
            display: inline-block;
            border: 1px solid #1e1f22;
        }

        /* Voice Overlay Section */
        #voice-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 15px;
            background: transparent;
        }

        #voice-notifs-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 80px;
            overflow-y: auto;
            scrollbar-width: none;
        }
        #voice-notifs-container::-webkit-scrollbar { display: none; }

        .voice-notif-item {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            color: #b5bac1;
            display: inline-block;
            align-self: flex-start;
        }

        .voice-notif-item.join { color: #57f287; }
        .voice-notif-item.leave { color: #ed4245; }
        .voice-notif-item.mute { color: #fee75c; }
        .voice-notif-item.force_mute { color: #eb459e; }
        .voice-notif-item.deafen { color: #fee75c; }
        .voice-notif-item.force_deafen { color: #eb459e; }

        #voice-users-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 6px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        #voice-users-container::-webkit-scrollbar { display: none; }

        .voice-user-card {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 8px;
            border-radius: 6px;
            backdrop-filter: blur(2px);
        }

        .voice-avatar-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
        }

        .voice-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            box-sizing: border-box;
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
            border: 2px solid transparent;
        }

        .voice-user-avatar.speaking {
            border-color: #23a55a;
            box-shadow: 0 0 8px #23a55a;
        }

        .voice-user-name {
            font-size: 13px;
            font-weight: 600;
            color: #f2f3f5;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .voice-status-badges {
            display: flex;
            gap: 4px;
            font-size: 12px;
        }

        .voice-badge {
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            background: rgba(237, 66, 69, 0.2);
            color: #ed4245;
            border: 1px solid rgba(237, 66, 69, 0.4);
        }

        .voice-badge.force {
            background: rgba(235, 69, 158, 0.2);
            color: #eb459e;
            border: 1px solid rgba(235, 69, 158, 0.4);
        }

        .voice-badge.live {
            background: rgba(237, 66, 69, 0.3);
            color: #ed4245;
            border: 1px solid rgba(237, 66, 69, 0.6);
            font-weight: bold;
        }

        .voice-badge.watching {
            background: rgba(88, 101, 242, 0.35);
            color: #7983f5;
            border: 1px solid rgba(88, 101, 242, 0.6);
            font-weight: bold;
            font-size: 14px;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        
        #waiting-status {
            color: rgba(255,255,255,0.5);
            text-align: center;
            font-style: italic;
            padding: 20px;
        }
        /* Typing Indicator */
        .typing-indicator-container {
            display: flex;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            color: #b5bac1;
            margin-top: 4px;
            animation: fadeIn 0.2s ease;
        }

        .typing-dots {
            display: flex;
            align-items: center;
            margin-right: 8px;
        }

        .typing-dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #b5bac1;
            margin-right: 3px;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Theme Overrides */
        .gaming-overlay-container.theme-oled {
            background: #000000 !important;
            border: 1px solid #222222;
        }
        .gaming-overlay-container.theme-oled .voice-user-card,
        .gaming-overlay-container.theme-oled .voice-notif-item {
            background: #111111 !important;
            border: 1px solid #282828;
        }

        .gaming-overlay-container.theme-cyberpunk {
            background: rgba(13, 2, 33, 0.88) !important;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.35);
        }
        .gaming-overlay-container.theme-cyberpunk .voice-user-card,
        .gaming-overlay-container.theme-cyberpunk .voice-notif-item {
            background: rgba(26, 6, 60, 0.75) !important;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }
        .gaming-overlay-container.theme-cyberpunk .voice-user-name {
            color: #00ffcc;
        }

        .gaming-overlay-container.theme-synthwave {
            background: rgba(26, 11, 46, 0.88) !important;
            border: 1px solid #ff2a85;
            box-shadow: 0 0 12px rgba(255, 42, 133, 0.35);
        }
        .gaming-overlay-container.theme-synthwave .voice-user-card,
        .gaming-overlay-container.theme-synthwave .voice-notif-item {
            background: rgba(45, 15, 75, 0.75) !important;
            border: 1px solid rgba(255, 42, 133, 0.3);
        }
        .gaming-overlay-container.theme-synthwave .voice-user-name {
            color: #ff71ce;
        }

        /* Theme: Glassmorphic Frost (Original Clean Glass) */
        .gaming-overlay-container.theme-glass {
            background: rgba(255, 255, 255, 0.08) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .gaming-overlay-container.theme-glass .voice-user-card,
        .gaming-overlay-container.theme-glass .voice-notif-item {
            background: rgba(255, 255, 255, 0.15) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .gaming-overlay-container.theme-glass .voice-user-name {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Theme: Vaporwave Sunset */
        .gaming-overlay-container.theme-vaporwave {
            background: linear-gradient(180deg, rgba(38, 12, 64, 0.88) 0%, rgba(89, 15, 87, 0.88) 100%) !important;
            border: 1px solid #ff71ce;
            box-shadow: 0 0 14px rgba(255, 113, 206, 0.4);
        }
        .gaming-overlay-container.theme-vaporwave .voice-user-card,
        .gaming-overlay-container.theme-vaporwave .voice-notif-item {
            background: rgba(255, 113, 206, 0.12) !important;
            border: 1px solid rgba(255, 113, 206, 0.3);
        }
        .gaming-overlay-container.theme-vaporwave .voice-user-name {
            color: #01cdfe;
        }

        /* Theme: Emerald Forest */
        .gaming-overlay-container.theme-emerald {
            background: rgba(6, 38, 23, 0.9) !important;
            border: 1px solid #059669;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }
        .gaming-overlay-container.theme-emerald .voice-user-card,
        .gaming-overlay-container.theme-emerald .voice-notif-item {
            background: rgba(6, 78, 59, 0.6) !important;
            border: 1px solid rgba(52, 211, 153, 0.25);
        }
        .gaming-overlay-container.theme-emerald .voice-user-name {
            color: #facc15;
        }

        /* Theme: Blood Moon */
        .gaming-overlay-container.theme-bloodmoon {
            background: rgba(35, 7, 7, 0.92) !important;
            border: 1px solid #dc2626;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.4);
        }
        .gaming-overlay-container.theme-bloodmoon .voice-user-card,
        .gaming-overlay-container.theme-bloodmoon .voice-notif-item {
            background: rgba(69, 10, 10, 0.7) !important;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .gaming-overlay-container.theme-bloodmoon .voice-user-name {
            color: #f87171;
        }

        /* Theme: Aurora Teal */
        .gaming-overlay-container.theme-aurora {
            background: linear-gradient(135deg, rgba(8, 51, 68, 0.9) 0%, rgba(46, 16, 101, 0.9) 100%) !important;
            border: 1px solid #06b6d4;
            box-shadow: 0 0 14px rgba(6, 182, 212, 0.35);
        }
        .gaming-overlay-container.theme-aurora .voice-user-card,
        .gaming-overlay-container.theme-aurora .voice-notif-item {
            background: rgba(14, 116, 144, 0.35) !important;
            border: 1px solid rgba(34, 211, 238, 0.3);
        }
        .gaming-overlay-container.theme-aurora .voice-user-name {
            color: #a5f3fc;
        }

        /* Theme: Retro Matrix */
        .gaming-overlay-container.theme-matrix {
            background: #03140a !important;
            border: 1px solid #00ff66;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.3);
        }
        .gaming-overlay-container.theme-matrix .voice-user-card,
        .gaming-overlay-container.theme-matrix .voice-notif-item {
            background: #062b16 !important;
            border: 1px solid rgba(0, 255, 102, 0.3);
        }
        .gaming-overlay-container.theme-matrix .voice-user-name {
            color: #00ff66;
            font-family: 'Courier New', monospace;
        }

        /* Theme: Minimal Slate */
        .gaming-overlay-container.theme-slate {
            background: rgba(30, 41, 59, 0.88) !important;
            border: 1px solid #475569;
        }
        .gaming-overlay-container.theme-slate .voice-user-card,
        .gaming-overlay-container.theme-slate .voice-notif-item {
            background: rgba(15, 23, 42, 0.75) !important;
            border: 1px solid #334155;
        }

        /* Theme-specific Highlighted Message Accents */
        .gaming-overlay-container.theme-oled .gaming-overlay-message.highlighted-message {
            background-color: rgba(255, 255, 255, 0.12) !important;
            border-left-color: #ffffff !important;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
        }
        .gaming-overlay-container.theme-cyberpunk .gaming-overlay-message.highlighted-message {
            background-color: rgba(255, 0, 128, 0.25) !important;
            border-left-color: #ff007f !important;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
        }
        .gaming-overlay-container.theme-synthwave .gaming-overlay-message.highlighted-message {
            background-color: rgba(255, 42, 133, 0.25) !important;
            border-left-color: #ff2a85 !important;
            box-shadow: 0 0 12px rgba(255, 113, 206, 0.5);
        }
        .gaming-overlay-container.theme-glass .gaming-overlay-message.highlighted-message {
            background-color: rgba(255, 255, 255, 0.25) !important;
            border-left-color: #38bdf8 !important;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(10px);
        }
        .gaming-overlay-container.theme-vaporwave .gaming-overlay-message.highlighted-message {
            background-color: rgba(255, 113, 206, 0.25) !important;
            border-left-color: #01cdfe !important;
            box-shadow: 0 0 12px rgba(255, 113, 206, 0.4);
        }
        .gaming-overlay-container.theme-emerald .gaming-overlay-message.highlighted-message {
            background-color: rgba(16, 185, 129, 0.25) !important;
            border-left-color: #facc15 !important;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
        }
        .gaming-overlay-container.theme-bloodmoon .gaming-overlay-message.highlighted-message {
            background-color: rgba(220, 38, 38, 0.3) !important;
            border-left-color: #ff4d4d !important;
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.5);
        }
        .gaming-overlay-container.theme-aurora .gaming-overlay-message.highlighted-message {
            background-color: rgba(6, 182, 212, 0.25) !important;
            border-left-color: #a5f3fc !important;
            box-shadow: 0 0 12px rgba(34, 211, 238, 0.5);
        }
        .gaming-overlay-container.theme-matrix .gaming-overlay-message.highlighted-message {
            background-color: rgba(0, 255, 102, 0.2) !important;
            border-left-color: #00ff66 !important;
            box-shadow: 0 0 14px rgba(0, 255, 102, 0.5);
        }
        .gaming-overlay-container.theme-slate .gaming-overlay-message.highlighted-message {
            background-color: rgba(71, 85, 105, 0.5) !important;
            border-left-color: #94a3b8 !important;
            box-shadow: 0 0 10px rgba(148, 163, 184, 0.3);
        }
    </style>
</head>
<body>
    <div class="gaming-overlay-container" id="container">
        
        <!-- Text Chat Section -->
        <div id="text-section" style="display: none;">
            <div class="gaming-overlay-messages" id="messages-container"></div>
            
            <div class="typing-indicator-container" id="typing-container" style="display: none;">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <div class="typing-text" id="typing-text"></div>
            </div>
            
            <div class="gaming-overlay-input-container" id="input-container" style="display: none;">
                <input type="text" class="gaming-overlay-input" id="chat-input" placeholder="Message... (Press Ctrl+Shift+Enter to close)">
            </div>
        </div>

        <!-- Voice Chat Section -->
        <div id="voice-section">
            <div id="voice-notifs-container"></div>
            <div id="voice-users-container"></div>
        </div>

    </div>

    <script src="./renderer.js"></script>
</body>
</html>
